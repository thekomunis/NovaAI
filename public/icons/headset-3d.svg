<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="headsetGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="0.5" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Soundwave Rings -->
  <circle cx="60" cy="60" r="50" stroke="#34D399" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="60" cy="60" r="42" stroke="#34D399" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Headband Arc -->
  <path d="M26 64C26 40 41 22 60 22C79 22 94 40 94 64" stroke="url(#headsetGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Left Ear Cushion -->
  <rect x="18" y="54" width="16" height="32" rx="8" fill="#10B981" stroke="#34D399" stroke-width="3"/>
  <rect x="22" y="58" width="8" height="24" rx="4" fill="#047857"/>

  <!-- Right Ear Cushion -->
  <rect x="86" y="54" width="16" height="32" rx="8" fill="#10B981" stroke="#34D399" stroke-width="3"/>
  <rect x="90" y="58" width="8" height="24" rx="4" fill="#047857"/>

  <!-- Mic Arm & Capsule -->
  <path d="M28 78C28 92 42 98 56 98H64" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
  <rect x="62" y="92" width="12" height="12" rx="4" fill="#F59E0B"/>
